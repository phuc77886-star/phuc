<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Quỹ Lớp Realtime</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        .tab-btn.active {
            border-bottom: 3px solid #2563eb;
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                💰 Quản Lý Quỹ Lớp Realtime
            </h1>
            <span id="connection-status" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full border border-blue-400">
                🔄 Đang kết nối...
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto mt-6 px-4 space-y-6">

        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-300 bg-white rounded-t-lg shadow-sm px-4">
            <button onclick="switchTab('dot-thu')" id="tab-dot-thu" class="tab-btn active py-3 px-6 text-sm sm:text-base focus:outline-none transition">
                📌 Các Đợt Thu Quỹ
            </button>
            <button onclick="switchTab('chi-tieu')" id="tab-chi-tieu" class="tab-btn py-3 px-6 text-sm sm:text-base focus:outline-none transition">
                💸 Lịch Sử Chi Tiêu
            </button>
        </div>

        <!-- TAB 1: ĐỢT THU QUỸ -->
        <section id="content-dot-thu" class="space-y-6">
            <!-- Form Tạo Đợt Thu Mới -->
            <div class="bg-white p-5 rounded-b-lg rounded-tr-lg shadow-sm border border-gray-200">
                <h2 class="text-base font-semibold mb-3 text-slate-700 flex items-center gap-2">
                    ➕ Tạo Đợt Thu Mới
                </h2>
                <form id="form-create-collection" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="collection-title" placeholder="Tên đợt thu (VD: Quỹ đợt 1)" required
                        class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="collection-amount" placeholder="Số tiền mỗi HS (VNĐ)" required min="0" step="1000"
                        class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md px-4 py-2 transition shadow-sm">
                        Tạo Đợt Thu
                    </button>
                </form>
            </div>

            <!-- Danh Sách Đợt Thu Thu Gọn (Tabs) -->
            <div id="collections-tabs" class="flex gap-2 overflow-x-auto pb-2">
                <!-- Tab đợt thu sẽ render ở đây -->
            </div>

            <!-- Khung Hiển Thị Đợt Thu Được Chọn -->
            <div id="collections-list" class="space-y-6">
                <p class="text-center text-gray-500 py-8 bg-white rounded-lg border">Chưa có đợt thu nào được tạo.</p>
            </div>
        </section>

        <!-- TAB 2: QUẢN LÝ CHI TIÊU -->
        <section id="content-chi-tieu" class="hidden space-y-6">
            <!-- Form Thêm Chi Tiêu -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-base font-semibold mb-3 text-slate-700 flex items-center gap-2">
                    ➕ Ghi Nhận Chi Tiêu Quỹ
                </h2>
                <form id="form-add-expense" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="text" id="expense-title" placeholder="Nội dung chi (VD: Mua phấn, dọn dẹp...)" required
                        class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="number" id="expense-amount" placeholder="Số tiền chi (VNĐ)" required min="0" step="1000"
                        class="border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit"
                        class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium rounded-md px-4 py-2 transition shadow-sm">
                        Lưu Chi Tiêu
                    </button>
                </form>
            </div>

            <!-- Lịch Sử Chi Tiêu -->
            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                <h3 class="font-semibold text-slate-700 mb-4">Danh Sách Các Khoản Chi</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-50 text-slate-600 border-b">
                            <tr>
                                <th class="p-3">Nội Dung Chi</th>
                                <th class="p-3 text-right">Số Tiền</th>
                                <th class="p-3 text-center">Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-body">
                            <tr>
                                <td colspan="3" class="text-center py-4 text-gray-400">Chưa có khoản chi nào.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Script Xử Lý Realtime Firebase -->
    <script>
        // Cấu hình Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://quylop-default-rtdb.firebaseio.com"
        };

        // Khởi tạo Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Trạng thái kết nối
        db.ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById("connection-status");
            if (snap.val() === true) {
                statusEl.innerText = "🟢 Đã kết nối Realtime";
                statusEl.className = "text-xs bg-green-700 px-2.5 py-1 rounded-full border border-green-400";
            } else {
                statusEl.innerText = "🔴 Mất kết nối";
                statusEl.className = "text-xs bg-red-700 px-2.5 py-1 rounded-full border border-red-400";
            }
        });

        // Biến toàn cục
        let globalCollections = {};
        let activeCollectionId = null;
        let defaultStudents = [];

        // Chuyển Tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if (tabName === 'dot-thu') {
                document.getElementById('content-dot-thu').classList.remove('hidden');
                document.getElementById('content-chi-tieu').classList.add('hidden');
            } else {
                document.getElementById('content-dot-thu').classList.add('hidden');
                document.getElementById('content-chi-tieu').classList.remove('hidden');
            }
        }

        // 1. Tạo Đợt Thu Mới
        document.getElementById('form-create-collection').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('collection-title').value.trim();
            const amount = parseInt(document.getElementById('collection-amount').value);

            if (!title || isNaN(amount)) return;

            const newRef = db.ref('collections').push();
            
            // Khởi tạo danh sách học sinh mặc định nếu có
            let initialStudents = {};
            if (defaultStudents.length > 0) {
                defaultStudents.forEach(st => {
                    initialStudents[st.id] = { name: st.name, paid: false };
                });
            }

            newRef.set({
                title: title,
                amountPerStudent: amount,
                createdAt: firebase.database.ServerValue.TIMESTAMP,
                students: initialStudents
            }).then(() => {
                document.getElementById('collection-title').value = '';
                document.getElementById('collection-amount').value = '';
                activeCollectionId = newRef.key; // Tự chuyển sang đợt mới tạo
            });
        });

        // 2. Lắng nghe Danh Sách Đợt Thu từ Firebase
        db.ref('collections').on('value', (snapshot) => {
            globalCollections = snapshot.val() || {};
            renderCollectionsNavAndContent();
        });

        // Lắng nghe danh sách học sinh mặc định (nếu có lưu chung)
        db.ref('default_students').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                defaultStudents = Object.keys(data).map(k => ({ id: k, name: data[k].name }));
            }
        });

        // Render Tabs Chọn Đợt Thu & Nội Dung Chi Tiết
        function renderCollectionsNavAndContent() {
            const navContainer = document.getElementById('collections-tabs');
            const contentContainer = document.getElementById('collections-list');

            const keys = Object.keys(globalCollections);

            if (keys.length === 0) {
                navContainer.innerHTML = '';
                contentContainer.innerHTML = `<p class="text-center text-gray-500 py-8 bg-white rounded-lg border">Chưa có đợt thu nào được tạo.</p>`;
                return;
            }

            // Chọn đợt thu mới nhất nếu chưa chọn
            if (!activeCollectionId || !globalCollections[activeCollectionId]) {
                activeCollectionId = keys[keys.length - 1];
            }

            // 1. Render Menu Chọn Đợt Thu (Tách riêng biệt các đợt)
            let navHtml = '';
            keys.reverse().forEach(id => {
                const item = globalCollections[id];
                const isActive = id === activeCollectionId;
                const activeClass = isActive 
                    ? 'bg-blue-600 text-white font-medium shadow-sm' 
                    : 'bg-white text-slate-700 hover:bg-slate-200 border border-gray-300';

                navHtml += `
                    <button onclick="selectCollection('${id}')" class="px-4 py-2 rounded-lg text-sm whitespace-nowrap transition flex items-center gap-2 ${activeClass}">
                        📁 ${item.title}
                    </button>
                `;
            });
            navContainer.innerHTML = navHtml;

            // 2. Render Nội Dung Của Đợt Thu Được Chọn
            const currentItem = globalCollections[activeCollectionId];
            if (!currentItem) return;

            const students = currentItem.students || {};
            const studentKeys = Object.keys(students);
            
            let paidCount = 0;
            studentKeys.forEach(k => { if (students[k].paid) paidCount++; });

            const totalAmount = paidCount * (currentItem.amountPerStudent || 0);

            let studentsListHtml = '';
            if (studentKeys.length === 0) {
                studentsListHtml = `<tr><td colspan="3" class="p-4 text-center text-gray-400">Chưa có học sinh trong danh sách đợt thu này.</td></tr>`;
            } else {
                studentKeys.forEach((sId, index) => {
                    const st = students[sId];
                    studentsListHtml += `
                        <tr class="border-b hover:bg-slate-50 transition">
                            <td class="p-3 font-medium text-slate-600">${index + 1}</td>
                            <td class="p-3 font-medium ${st.paid ? 'line-through text-gray-400' : 'text-slate-800'}">${st.name}</td>
                            <td class="p-3 text-center">
                                <label class="inline-flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" ${st.paid ? 'checked' : ''} 
                                        onchange="togglePayment('${activeCollectionId}', '${sId}', this.checked)"
                                        class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
                                    <span class="text-xs ${st.paid ? 'text-green-600 font-semibold' : 'text-gray-400'}">
                                        ${st.paid ? 'Đã đóng' : 'Chưa đóng'}
                                    </span>
                                </label>
                            </td>
                        </tr>
                    `;
                });
            }

            contentContainer.innerHTML = `
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 gap-2">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${currentItem.title}</h3>
                            <p class="text-sm text-slate-500">Mức thu: <span class="font-semibold text-blue-600">${(currentItem.amountPerStudent || 0).toLocaleString()} VNĐ</span>/HS</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <div class="text-xs text-slate-500">Đã thu (${paidCount}/${studentKeys.length})</div>
                                <div class="text-lg font-bold text-green-600">${totalAmount.toLocaleString()} VNĐ</div>
                            </div>
                            <button onclick="deleteCollection('${activeCollectionId}')" class="text-red-500 hover:text-red-700 text-xs border border-red-200 px-2.5 py-1.5 rounded hover:bg-red-50 transition">
                                🗑️ Xóa Đợt
                            </button>
                        </div>
                    </div>

                    <!-- Form Thêm Học Sinh -->
                    <form onsubmit="addStudent(event, '${activeCollectionId}')" class="flex gap-2">
                        <input type="text" id="input-student-name-${activeCollectionId}" placeholder="Thêm tên học sinh mới..." required
                            class="flex-1 border rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button type="submit" class="bg-slate-700 hover:bg-slate-800 text-white text-sm px-4 py-1.5 rounded-md transition">
                            Thêm HS
                        </button>
                    </form>

                    <!-- Bảng Danh Sách Học Sinh -->
                    <div class="overflow-x-auto border rounded-lg">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-50 text-slate-600 border-b">
                                <tr>
                                    <th class="p-3 w-12">STT</th>
                                    <th class="p-3">Họ và Tên</th>
                                    <th class="p-3 text-center w-36">Trạng Thái Quỹ</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${studentsListHtml}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Chọn đợt thu từ menu
        function selectCollection(id) {
            activeCollectionId = id;
            renderCollectionsNavAndContent();
        }

        // 3. Cập nhật Trạng Thái Đóng Quỹ (LƯU TRỰC TIẾP LÊN FIREBASE REALTIME)
        function togglePayment(collectionId, studentId, isPaid) {
            db.ref(`collections/${collectionId}/students/${studentId}/paid`).set(isPaid)
                .catch(error => {
                    alert("Lỗi khi lưu dữ liệu: " + error.message);
                });
        }

        // 4. Thêm Học Sinh Vào Đợt Thu
        function addStudent(event, collectionId) {
            event.preventDefault();
            const inputEl = document.getElementById(`input-student-name-${collectionId}`);
            const name = inputEl.value.trim();

            if (!name) return;

            const studentRef = db.ref(`collections/${collectionId}/students`).push();
            studentRef.set({
                name: name,
                paid: false
            }).then(() => {
                inputEl.value = '';
            });
        }

        // 5. Xóa Đợt Thu
        function deleteCollection(collectionId) {
            if (confirm("Bạn có chắc chắn muốn xóa đợt thu này không?")) {
                db.ref(`collections/${collectionId}`).remove();
            }
        }

        // 6. Quản Lý Chi Tiêu
        document.getElementById('form-add-expense').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('expense-title').value.trim();
            const amount = parseInt(document.getElementById('expense-amount').value);

            if (!title || isNaN(amount)) return;

            db.ref('expenses').push({
                title: title,
                amount: amount,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                document.getElementById('expense-title').value = '';
                document.getElementById('expense-amount').value = '';
            });
        });

        // Lắng nghe Lịch Sử Chi Tiêu
        db.ref('expenses').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            const tbody = document.getElementById('expenses-table-body');

            const keys = Object.keys(data);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-gray-400">Chưa có khoản chi nào.</td></tr>`;
                return;
            }

            let html = '';
            keys.reverse().forEach(id => {
                const item = data[id];
                html += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-3 font-medium text-slate-800">${item.title}</td>
                        <td class="p-3 text-right font-bold text-red-600">-${(item.amount || 0).toLocaleString()} VNĐ</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteExpense('${id}')" class="text-red-500 hover:text-red-700 text-xs">🗑️ Xóa</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        });

        function deleteExpense(id) {
            if (confirm("Bạn có chắc chắn muốn xóa khoản chi này?")) {
                db.ref(`expenses/${id}`).remove();
            }
        }
    </script>
</body>
</html>
